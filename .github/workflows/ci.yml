name: CI

on:
  pull_request:
  push:
    branches-ignore: [release, "dependabot/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Check, test, and build
        run: devenv shell -- just check
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qownnotes-mobile-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  device-test:
    name: device-test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A failing shard must not cancel the others or discard their diagnostics.
      fail-fast: false
      matrix:
        include:
          - suite: app-0
            build-tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            test-tasks: ":app:connectedDebugAndroidTest"
            runner-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=0"
          - suite: app-1
            build-tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            test-tasks: ":app:connectedDebugAndroidTest"
            runner-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=1"
          - suite: app-2
            build-tasks: ":app:assembleDebug :app:assembleDebugAndroidTest"
            test-tasks: ":app:connectedDebugAndroidTest"
            runner-args: "-Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=2"
          - suite: libraries
            build-tasks: ":backend-nextcloud:assembleDebugAndroidTest :data:assembleDebugAndroidTest :markdown-android:assembleDebugAndroidTest :notefolder-sqlite:assembleDebugAndroidTest"
            test-tasks: ":backend-nextcloud:connectedDebugAndroidTest :data:connectedDebugAndroidTest :markdown-android:connectedDebugAndroidTest :notefolder-sqlite:connectedDebugAndroidTest"
            runner-args: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build device-test APKs
        timeout-minutes: 20
        run: ./gradlew --no-daemon --no-configuration-cache ${{ matrix.build-tasks }}
      - name: Run Android device tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot -no-boot-anim -noaudio
            -gpu swiftshader_indirect -camera-back none
          # Run once: blanket retries overwrite reports and can exhaust the job timeout.
          # Serialize modules that share this emulator and finish other modules after a failure.
          script: ./gradlew --no-daemon --no-configuration-cache --no-parallel --continue ${{ matrix.test-tasks }} ${{ matrix.runner-args }}
      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-reports-${{ matrix.suite }}-${{ github.sha }}
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
            **/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14
