name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Read and validate release version
        run: |
          . ./version.properties
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Verify release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
      - name: Extract release notes from changelog
        run: |
          awk -v version="$VERSION_NAME" '
            BEGIN { heading = "## [" version "]" }
            capture && /^## \[/ { exit }
            $0 == heading || index($0, heading " - ") == 1 { capture = 1 }
            capture { print }
            END { if (!capture) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/qownnotes-release.jks
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Check and build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/qownnotes-release.jks
        run: |
          devenv shell -- just release
          devenv shell -- bash -c \
            '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$1"' \
            _ app/build/outputs/apk/release/app-release.apk
      - name: Verify and prepare release packages
        run: |
          mkdir release-files
          cp app/build/outputs/apk/release/app-release.apk \
            "release-files/QOwnNotes-Mobile-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "release-files/QOwnNotes-Mobile-$VERSION_NAME.aab"
          (cd release-files && sha256sum \
            "QOwnNotes-Mobile-$VERSION_NAME.apk" \
            "QOwnNotes-Mobile-$VERSION_NAME.aab" > SHA256SUMS)
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-files/QOwnNotes-Mobile-$VERSION_NAME.apk" \
            "release-files/QOwnNotes-Mobile-$VERSION_NAME.aab" \
            release-files/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "QOwnNotes Mobile $VERSION_NAME" \
            --notes-file release-notes.md \
            --draft
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
