version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # Gradle, AGP, Kotlin, and KSP must move together as a compatible set.
      build-toolchain:
        patterns:
          - "gradle-wrapper"
          - "com.android.*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      # Routine library updates. Major library updates arrive as individual PRs.
      libraries:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
